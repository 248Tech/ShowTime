name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting! For **security** problems please use a private advisory instead (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
      placeholder: "When I ... it ... but I expected ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ShowTime version
      placeholder: "0.1.0 (see package.json or the release)"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: "Node.js version (node -v)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Server OS
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: "FFmpeg version (first line of: ffmpeg -version)"
  - type: input
    id: browser
    attributes:
      label: Browser(s) and version
      placeholder: "Edge 150, Firefox 140, Safari 19 ..."
  - type: textarea
    id: logs
    attributes:
      label: Server log / browser console output
      description: "Please remove anything private (emails, tokens, links)."
      render: shell
