name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "I want to ... but ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project principles
      options:
        - label: It doesn't reveal users' identity, avatar, presence or activity to non-friends
        - label: It doesn't need a heavy new dependency or a front-end build step
